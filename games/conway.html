<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <title>Maurice's BS</title>
    <link rel="stylesheet" href="/template.css">
    <script type="module" src="/utils.js"></script>
</head>
<body>
<div id="sharedLayout"> </div>
<template id="pageTemplate">
    <h1><u>Conway's Game of Life</u><h1>
    <h3> Settings </h3>
    <div style="height:.5em;"> </div>
    <div style="display:grid; grid-template-columns: 3fr repeat(9, 1fr); text-align: center; width: 45em;">
        <span style="text-align:left;"> # of cells adjacent: </span>
        <span> 0 </span> <span> 1 </span> <span> 2 </span> <span> 3 </span> <span> 4 </span>
        <span> 5 </span> <span> 6 </span> <span> 7 </span> <span> 8 </span>
        <span style="text-align:left;"> Survive conditions: </span>
        <input type="checkbox" id="s0" /> <input type="checkbox" id="s1" /> <input type="checkbox" id="s2" checked /> <input type="checkbox" id="s3" checked /> <input type="checkbox" id="s4" />
        <input type="checkbox" id="s5" /> <input type="checkbox" id="s6" /> <input type="checkbox" id="s7" /> <input type="checkbox" id="s8" />
        <span style="text-align:left;"> Birth conditions: </span>
        <input type="checkbox" id="b0" /> <input type="checkbox" id="b1" /> <input type="checkbox" id="b2" /> <input type="checkbox" id="b3" checked /> <input type="checkbox" id="b4" />
        <input type="checkbox" id="b5" /> <input type="checkbox" id="b6" /> <input type="checkbox" id="b7" /> <input type="checkbox" id="b8" />
    </div>
    <div style="height:.5em;"> </div>
    <div style="display:flex;">
        <label for="aliveColour">Alive cell colour: &nbsp;</label> <select id="aliveColour" name="aliveColour"> </select>
        &emsp;
        <label for="deadColour">Dead cell colour: &nbsp;</label> <select id="deadColour" name="deadColour"> </select>
    </div>
    <h3> Controls </h3>
    <div style="height:.5em;"> </div>
    <div> 
        <button id="playBtn" onclick="play();"> Play </button> 
        <button id="stepBtn" onclick="step();"> Step </button>
        <button id="clearBtn"> Clear </button>
        <span> &emsp; </span>
        <label for="speed">MS per generation:</label>
        <input type="number" id="speed" name="speed" value="200" min="10" max="1000" step="10" style="width:5em;">
        <span> &emsp; </span>
        <span id="genlabel"> </span>
        &emsp;
        <span id="rulestring"> Rulestring: B3/S23</span>
    </div>
    <br>
    <div style="display: flex; justify-content: center;"> <canvas id="display" style="aspect-ratio: 1 / 1; width:60%;"> </canvas> </div>
    <p><i>Click to draw pixels manually.</i></p>
    <br>
    <h3> Description </h3>
    <p> Conway's Game of Life has a grid of pixels (64x64 for this specific emulator), of which each cell could be dead or alive. 
        Each live cell survives into the next generation if it has 2 or 3 neighbours; and each dead cell comes to life if it has
        exactly 3 neighbours (Rulestring: B3/S23). Neighbours here are defined as the 8 immediately surrounding cells. This emulator
        lets you change the rules of how many cells to revive or let a cell survive into the next generation. 
    </p>
</template>
<script type="module" src = "/template.js"> </script>
<script type="module" src = "./conway.js"> </script>
</body>
</html>
