<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <title>Maurice's BS</title>
    <link rel="stylesheet" href="/template.css">
    <script type="module" src="/utils.js"></script>
</head>
<body>
<div id="sharedLayout"> </div>
<template id="pageTemplate">
    <h1> <u>Blackjack+</u></h1> <div style="height:.25em;"></div> Now with a copious amount of customisation! <br><br>
    
    <div style="display:flex; align-items:stretch; position:relative; padding: 0px; margin: 0px; border-top: 1px solid var(--colour-darkgrey); ">
    <div id="leftpanel" style="width:75%; height:fit-content;">
    <br>
    <div style="display:flex;">
        <div style="width:calc(100% - 8em)">
            <span id="bank"> Bank: $100 </span>
            <br>
            <label for="bet"> Bet amount per hand:</label>
            <input type="number" id="bet" name="bet" value="10" min="1" max="1000" step="1" style="width:5em;">
        </div>
        <button id="betbtn" onclick="btn_bet();"> PLACE BET </button>
        <style>
            #betbtn{
                width: 8em;
                color: var(--colour-black);
                font-weight: 700;
                background-color:var(--accent-colour1);
            }
            #betbtn:hover{
                background-color:var(--accent-colour1-tint);
            }
            #betbtn:disabled{
                background-color: var(--accent-bg1);
                color: var(--colour-lightgrey);
                cursor: not-allowed;
            }
        </style> 
    </div>
    <p>
        <button id="hit" onclick="btn_hit();"> Hit </button> 
        <button id="stand" onclick="btn_stand();"> Stand </button>
        <button id="doubleDown" onclick="btn_doubleDown();"> Double Down </button> 
        <button id="split" onclick="btn_split();"> Split </button>
    </p>
    <p id="status"><i>you shouldn't be seeing this</i></p>
    <div style="border-top: 1px solid var(--colour-lightgrey); width:95%; padding-bottom: .5em; padding-top:0px;"></div>
    <div style="overflow-y:auto;">
    <div id="maindiv" style="width: 95%; min-height: 5em; height:fit-content;"></div>
    </div>    
    </div>
    <div id="rightpanel" style="width:25%; overflow-y:auto; border-left:1px solid var(--colour-darkgrey); padding-left:.5em; padding-right:.5em; margin-top: .5em;">
        <h3> Game Settings </h3>  <div style="height:.5em;"></div> 
        <button id="defaultSettings" onclick="defaultSettings();"> Default settings </button> <div style="height:.25em;"></div> <button onclick="confirmSettings();" id="confirmSettings"> Confirm settings </button>
        <div style="width: 100%; margin:.5em 0px; border-bottom:1px solid var(--colour-lightgrey)"></div>
        Dealer must hit on this or lower, and stand otherwise: <div style="height:.5em; width:100%;"></div>
        <fieldset style="border:none; margin:0px; padding:0px;">
            <input style="margin:0px;" type="radio" id="hard" name="hiton" value="hard" />
            <label for="hard">Hard</label>
            <input style="margin:0px;" type="radio" id="soft" name="hiton" value="soft" checked/>
            <label for="soft">Soft</label>       
        </fieldset>
        <div style="height:.25em; width:100%;"></div>
        <input type="number" id="hiton" name="hitonNumber" style="width:70%;" value="17"/>
        <div style="width: 100%; margin:.5em 0px; border-bottom:1px solid var(--colour-lightgrey)"></div>
        Card probabilities:
    </div>
    </div>
    
</template>
<script type="module" src = "/template.js"> </script>
<script type="module" src = "./blackjack.js"> </script>
</body>
</html>
