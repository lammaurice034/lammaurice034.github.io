    <h1><u>Project overview: Fishy Fuckery</u></h1>
    <i>12 November, 2026</i>. <br> NOTE: This project is unfinished and had been put on hold till I feel like it.
    <p> Fish-with-a-hat simulator. </p>
    <h3> About the project </h3>
    <p> Have you ever imagined how life would be back in ye olden days,
        <br> in the midst of the first decade of this very millennium...
        <br> If you were an English orange porgy with a top hat? 
        <br> That recently moved to a rural town on the other side of the Alantic by accident?
        <br> And is a drunkard with access to vehicles, firearms and drugs?
    </p>
    <h3> What? </h3>
    <p> <b> THE GAME DOES NOT CONTAIN, NOR DOES THE AUTHOR CONDONE ACTS OF BESTIALITY. FOR THE LOVE OF GOD THAT IS JUST THE NAME.</b><br><br>
        It's a wacky ass game that I've made back in high school. You play as John Fishington the orange fish with a top hat,
        where you have to go around town for food, pay bills, drink spoiled milk and run a sandwich shop. Below is a screenshot from the game:
        <br> <br>
        <img src="./fishy_screenshot.png" style="border: 1px solid var(--colour-black);">
        <br> <br>
        This game is beyond unserious. I have, however, included the project here on the website because I spent most of my high school
        years working on it, gave up as it was super buggy and remastered it during my second year of university, and the project is put
        on hold after I realized it isn't really going anywhere. I genuinely have no idea what was going through my mind when I started this project.
    </p>
    <h3> Technical stuff </h3>
    <p> I suppose it had been interesting to work with Java Swing and java.awt.graphics for this game. No external libraries or game engines or anything,
        coding stuff like collision detection has been somewhat fun.        
    </p>
